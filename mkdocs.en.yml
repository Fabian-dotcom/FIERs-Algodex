              - Algebraic One-Pass Optimization: glossary/algebraic-one-pass.md
              - Bitwise Operations & Bitmasks: glossary/bit-manipulation.md
              - Mathematical Number Reversal: glossary/math-number-reversal.md
              - Roman Numerals: glossary/roman-numerals.md
              - Date & Calendar Arithmetic: glossary/date-arithmetic.md
              - Cyclic Permutations: glossary/cyclic-permutations.md
          - System & Performance:
