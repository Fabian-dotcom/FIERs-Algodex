site_name: FIER's Algodex
site_url: https://Fabian-dotcom.github.io/FIERs-Algodex/en/
site_description: Personal developer wiki & reference guide for algorithms, data structures, LeetCode solutions, and web security.
site_author: Fabian (FIER)
repo_url: https://github.com/Fabian-dotcom/FIERs-Algodex
repo_name: FIERs-Algodex

docs_dir: docs/en

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate

extra:
  alternate:
    - name: Deutsch
      link: /FIERs-Algodex/de/
      lang: de
    - name: English
      link: /FIERs-Algodex/en/
      lang: en

extra_css:
  - stylesheets/red-theme.css

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Core Algodex:
      - Home: index.md
      - Keyword Reference: references.md
      - Changelog: changelog.md
      - Learning Paths:
          - Graphs & Trees: roadmaps/graphs.md
          - Arrays & Strings: roadmaps/arrays-strings.md
          - Dynamic Programming: roadmaps/dynamic-programming.md
          - Math & Bit Manipulation: roadmaps/math-bit-manipulation.md
      - Glossary:
          - Graph Theory:
              - Adjacency List: glossary/adjazenzliste.md
              - Adjacency Matrix: glossary/adjazenzmatrix.md
              - CSR Format: glossary/csr-format.md
              - Graph Traversal (BFS & DFS): glossary/traversierung-bfs-dfs.md
              - Topological Sort: glossary/topologische-sortierung.md
              - State-Space Dijkstra: glossary/state-space-dijkstra.md
              - Advanced Tree Techniques: glossary/advanced-tree-techniques.md
              - PageRank: glossary/pagerank.md
              - Graph Neural Networks (GNN): glossary/gnn.md
          - Linear Structures & Search:
              - Hash Map & Hash Set: glossary/hash-map.md
              - Linked List: glossary/linked-list.md
              - Sliding Window Pattern: glossary/sliding-window.md
              - Binary Search: glossary/binary-search.md
              - Min-Heap & Sweep-Line: glossary/min-heap-sweep-line.md
          - Discrete Math & Bits:
