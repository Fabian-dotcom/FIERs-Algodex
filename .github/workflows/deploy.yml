name: Deploy FIER's Algodex to GitHub Pages

on:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          pip install mkdocs-material
          
      - name: Build German Site (de)
        run: mkdocs build -f mkdocs.de.yml -d site/de
        
      - name: Build English Site (en)
        run: mkdocs build -f mkdocs.en.yml -d site/en
        
      - name: Copy Root Redirect
        run: cp index.html site/index.html
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
